name: Update GitHub Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Check Docker version
        run: docker --version

      - name: Fetch and Inject Stats
        env:
          # Use a Personal Access Token (GH_PAT) if available to fetch private stats, otherwise fallback to GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python sync_stats.py

      - name: Generate Engineering Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: vrxmike
          template: classic
          base: header, activity, community
          config_timezone: Africa/Nairobi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: no
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_achievements: no
          filename: github-metrics.svg
          output_action: none
          extras_css: |
            .container { 
              background: rgba(13, 17, 23, 0.7) !important;
              backdrop-filter: blur(8px);
              border: 1px solid rgba(255, 255, 255, 0.1);
              border-radius: 10px;
            }

      - name: Debug - List Files
        run: ls -R

      - name: Move Metrics SVG
        run: |
          if [ -f /metrics_renders/github-metrics.svg ]; then
            sudo mv /metrics_renders/github-metrics.svg ./github-metrics.svg
          elif [ -f ./metrics_renders/github-metrics.svg ]; then
            mv ./metrics_renders/github-metrics.svg ./github-metrics.svg
          else
            echo "Metrics SVG not found in expected locations."
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md activity.svg github-metrics.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-update github stats, activity graph, and metrics"
            git pull --rebase origin main
            git push
          fi
